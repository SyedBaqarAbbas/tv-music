plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ytmusictv'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'dev.ytmusictv'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The app deliberately uses only the Android platform; no runtime libraries.
